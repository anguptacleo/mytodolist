<!-- assistant-chatbox.component.html -->
<div class="chatbox" [class.open]="isOpen">
  <div class="chat-header" (click)="toggleChat()">
    💬 Assistant
  </div>
  <div class="chat-body" *ngIf="isOpen">
    <div class="messages">
      <div *ngFor="let msg of messages" [class.user]="msg.sender === 'user'" [class.bot]="msg.sender === 'bot'">
        {{ msg.text }}
      </div>
    </div>
    <input [(ngModel)]="userInput" (keydown.enter)="sendMessage()" placeholder="Ask something..." />
  </div>
</div>
